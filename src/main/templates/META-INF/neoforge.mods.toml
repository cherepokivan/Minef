modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Серверный мод: создаёт виртуального игрока (фейк-игрока без сетевого подключения)
и позволяет управлять им командами /minef start|stop|status|say.
Нужен, чтобы держать постоянного "игрока" для мостов вроде Simple Voice Chat Discord Bridge.
Устанавливается только на сервер - клиентам ничего ставить не нужно.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="SERVER"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="SERVER"
